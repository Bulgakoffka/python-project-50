[project]
name = "hexlet-code"
version = "0.1.0"
description = "terminal program finding a differences between any 2 files. Supports json and yaml.ßß"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.1.0",
    "pyyaml>=6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pyyaml>=6.0.2",
    "ruff>=0.12.2",
]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"
